<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FairMate production architecture</title>
  <desc id="desc">Browser requests enter a capability-protected referee, which enforces chess.js legality and a five minute clock, calls Qwen 3.7 Max through the 0G Router verified TeeTLS boundary, writes evidence commitments to MoveJournal, and triggers a journal-bound ChallengePot payout. An offline verifier checks exported evidence and public chain state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#23c9b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8fa7c9"/>
    </marker>
    <style>
      .title{font:700 50px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f5f8ff;letter-spacing:-1.5px}
      .sub{font:400 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#9eb0ca}
      .label{font:700 25px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f7f9ff}
      .small{font:400 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#afbdd2}
      .micro{font:600 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#7fe3d7;letter-spacing:.8px}
      .box{fill:#13243d;stroke:#2d4668;stroke-width:2;rx:22;filter:url(#shadow)}
      .line{fill:none;stroke:#8fa7c9;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#6881a6;stroke-width:2.5;stroke-dasharray:10 9;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="10" r="360" fill="#7c5cff" opacity=".08"/>
  <circle cx="100" cy="870" r="330" fill="#23c9b8" opacity=".06"/>

  <text x="90" y="90" class="title">FairMate verification and payout flow</text>
  <text x="92" y="128" class="sub">Mainnet architecture • explicit trust boundaries • evidence-first game state</text>

  <g transform="translate(80 220)">
    <rect class="box" width="230" height="170"/>
    <rect x="24" y="25" width="52" height="40" rx="6" fill="none" stroke="#7fe3d7" stroke-width="3"/>
    <path d="M31 73h38M42 82h17" stroke="#7fe3d7" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="115" class="label">Browser</text>
    <text x="24" y="143" class="small">Moves + wallet</text>
  </g>

  <g transform="translate(405 195)">
    <rect width="325" height="220" rx="24" fill="url(#hero)" opacity=".98" filter="url(#shadow)"/>
    <text x="28" y="55" class="micro" fill="#fff">SERVER TRUST BOUNDARY</text>
    <text x="28" y="100" class="label">Capability-protected</text>
    <text x="28" y="133" class="label">Referee</text>
    <path d="M30 157h265" stroke="#fff" opacity=".25"/>
    <text x="28" y="188" class="small" fill="#f7f9ff">Authoritative orchestration</text>
  </g>

  <g transform="translate(405 500)">
    <rect class="box" width="325" height="170"/>
    <text x="27" y="48" class="micro">DETERMINISTIC GAME RULES</text>
    <text x="27" y="92" class="label">chess.js • 5+0</text>
    <text x="27" y="124" class="small">Legality, clock and result gate</text>
    <text x="27" y="148" class="small">No fabricated fallback move</text>
  </g>

  <g transform="translate(835 180)">
    <rect x="-14" y="-14" width="358" height="248" rx="28" fill="none" stroke="#7c5cff" stroke-width="3" stroke-dasharray="12 8"/>
    <rect class="box" width="330" height="220"/>
    <text x="26" y="48" class="micro">0G ROUTER TRUST BOUNDARY</text>
    <text x="26" y="91" class="label">qwen3.7-max</text>
    <text x="26" y="127" class="small">Verified TeeTLS</text>
    <text x="26" y="155" class="small">verify_tee=true</text>
    <text x="26" y="183" class="small">Pinned provider + trace</text>
  </g>

  <g transform="translate(835 500)">
    <rect class="box" width="300" height="170"/>
    <text x="26" y="48" class="micro">ARISTOTLE MAINNET</text>
    <text x="26" y="91" class="label">MoveJournal</text>
    <text x="26" y="124" class="small">SAN/FEN + receipt hashes</text>
    <text x="26" y="149" class="small">Sequential game record</text>
  </g>

  <g transform="translate(1240 500)">
    <rect class="box" width="280" height="170"/>
    <text x="26" y="48" class="micro">JOURNAL-BOUND</text>
    <text x="26" y="91" class="label">ChallengePot</text>
    <text x="26" y="124" class="small">Permissionless award</text>
    <text x="26" y="149" class="small">0.1 OG player-win payout</text>
  </g>

  <g transform="translate(835 745)">
    <rect width="685" height="105" rx="22" fill="#0d1c31" stroke="#23c9b8" stroke-width="2"/>
    <text x="26" y="43" class="micro">INDEPENDENT CHECK</text>
    <text x="26" y="76" class="label">Offline verifier</text>
    <text x="260" y="74" class="small">Evidence hashes • SAN replay • receipts • events • pot binding</text>
  </g>

  <path class="line" d="M310 305H405"/>
  <text x="329" y="288" class="small">move</text>
  <path class="line" d="M730 285H835"/>
  <text x="748" y="265" class="small">request</text>
  <path class="line" d="M835 350H730"/>
  <text x="742" y="378" class="small">verified response</text>
  <path class="line" d="M566 415V500"/>
  <path class="line" d="M730 585H835"/>
  <text x="748" y="566" class="small">commit</text>
  <path class="line" d="M1135 585H1240"/>
  <text x="1150" y="566" class="small">winner</text>
  <path class="dash" d="M195 390V797H835"/>
  <text x="216" y="776" class="small">downloaded evidence</text>
  <path class="dash" d="M985 670V745"/>
  <path class="dash" d="M1380 670V745"/>
</svg>